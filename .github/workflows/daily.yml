name: JobRadar 2-Hour Matching Digest

on:
  schedule:
    # Run every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no messages sent, no DB updates)'
        required: false
        type: boolean
        default: false
      user_id:
        description: 'Target specific Telegram User ID (default: 6119045686)'
        required: false
        type: string
        default: '6119045686'

jobs:
  run-daily-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run JobRadar Daily Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'job_radar' }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || 'local' }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          FREEHIRE_BASE_URL: ${{ secrets.FREEHIRE_BASE_URL || 'https://freehire.me/api/v1' }}
          GREENHOUSE_COMPANIES: ${{ secrets.GREENHOUSE_COMPANIES || 'cloudflare,stripe,gitlab,automattic' }}
          LEVER_COMPANIES: ${{ secrets.LEVER_COMPANIES || 'postman,netflix,spotify' }}
          ASHBY_COMPANIES: ${{ secrets.ASHBY_COMPANIES || 'retool,linear,ramp' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          TARGET_UID="${{ inputs.user_id || '6119045686' }}"
          if [ -n "$TARGET_UID" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --user-id $TARGET_UID"
          fi
          python daily_run.py $EXTRA_ARGS
